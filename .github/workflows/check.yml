name: Check publishing tools
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: bash -n scripts/publish.sh
      - run: python3 -m unittest discover -s test -v
